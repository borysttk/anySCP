<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <!--
      viewport-fit=cover lets the app paint into the display cutout / rounded
      corner area on Android; without it the system leaves inert letterbox bars.
      It is what makes env(safe-area-inset-*) report non-zero values, so the
      bottom sheet and key bar can keep clear of the gesture bar.

      maximum-scale=1 + user-scalable=no: pinch-zooming a terminal emulator
      breaks the character grid xterm.js measures against, and double-tap zoom
      would fight the tap-to-open-folder gesture. Text size remains adjustable
      through the app's own font-size setting.
    -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <title>anySCP</title>
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
